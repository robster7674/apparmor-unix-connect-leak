name: aa3833 riscv64 kernel test
# Native riscv64 build of the pinned mainline commit, unpatched and with the fix, then the same guest test
# as x86/arm64 in a QEMU guest on the runner (TCG: the RISE boards have no hypervisor extension).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: mainline commit
        default: 4405c18c95d2d0f99f6c581ef0ee8591a1aa6ccd
      kernels_run:
        description: "run id to take Image-base/Image-fix from (skips the build and the unpatched guest test; empty: build and test both)"
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Host info
        run: uname -a; nproc; free -g; df -h /; cat /proc/cpuinfo | grep -m3 -E 'isa|uarch|model'
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential gcc-14 flex bison bc libelf-dev libssl-dev dwarves git ca-certificates cpio kmod \
            libasound2t64 qemu-system-misc qemu-utils opensbi u-boot-qemu cloud-image-utils python3 rsync
      - name: Stage scripts
        run: sudo install -m 755 build-arch.sh vm.sh guest-test.sh /root/ && sudo install -m 644 fix.patch /root/
      - name: Previous kernels
        if: inputs.kernels_run != ''
        env:
          RUN: ${{ inputs.kernels_run }}
        run: '[[ "$RUN" =~ ^[0-9]+$ ]] || { echo "kernels_run must be a run id"; exit 1; }'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.kernels_run != ''
        with:
          name: aa3833-riscv64
          run-id: ${{ inputs.kernels_run }}
          github-token: ${{ github.token }}
          path: prev
      - name: Stage previous kernels
        if: inputs.kernels_run != ''
        run: sudo mkdir -p /root/out/riscv && sudo cp prev/riscv/Image-base prev/riscv/Image-fix /root/out/riscv/ && sudo sha256sum /root/out/riscv/Image-*
      - name: Build base + fix
        if: inputs.kernels_run == ''
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 hex"; exit 1; }
          sudo SHA="$SHA" J="$(nproc)" /root/build-arch.sh riscv
      - name: Guest test, unpatched
        if: inputs.kernels_run == ''
        run: sudo /root/vm.sh riscv rv-a prep && sudo /root/vm.sh riscv rv-a run /root/out/riscv/Image-base base
      - name: Guest test, fix
        env:
          PREV: ${{ inputs.kernels_run }}
        run: |
          [ -z "$PREV" ] || sudo /root/vm.sh riscv rv-a prep
          sudo /root/vm.sh riscv rv-a run /root/out/riscv/Image-fix fix
      - name: Collect
        if: always()
        run: |
          # the glob must expand as root: /root is not readable by the runner user
          sudo sh -c 'cp -r /root/out results; cp /root/vm/rv-a/console-*.log results/'
          sudo chown -R "$USER" results   # the Image files stay: kernels_run reuses them
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aa3833-riscv64
          path: results
