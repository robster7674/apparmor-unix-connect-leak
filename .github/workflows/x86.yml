name: x86_64 kernel matrix
# Newest longterm, newest stable and mainline head (resolve-kernels.py): each built unpatched and with fix.patch,
# then the same guest test as the other architectures in a QEMU guest on the runner (KVM when the runner has it).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "longterm, stable or mainline (empty: all three)"
        default: ""
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.r.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: r
        env:
          ONLY: ${{ inputs.only }}
        run: |
          [[ -z "$ONLY" || "$ONLY" =~ ^(longterm|stable|mainline)$ ]] || { echo "only must be longterm, stable or mainline"; exit 1; }
          m=$(python3 resolve-kernels.py $ONLY)
          echo "$m" | python3 -m json.tool
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
  test:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Host info
        run: uname -a; nproc; free -g; df -h / /mnt; ls -l /dev/kvm || true
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            build-essential flex bison bc libelf-dev libssl-dev dwarves git ca-certificates cpio kmod \
            qemu-system-x86 qemu-utils cloud-image-utils python3 rsync
      - name: Stage scripts
        run: sudo install -m 755 build-arch.sh vm.sh guest-test.sh /root/ && sudo install -m 644 fix.patch /root/
      - name: Build unpatched and fix
        env:
          SHA: ${{ matrix.sha }}
          REPO: ${{ matrix.repo }}
          REF: ${{ matrix.ref }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be 40 hex"; exit 1; }
          sudo mkdir -p /mnt/k
          sudo SHA="$SHA" REPO="$REPO" REF="$REF" J="$(nproc)" WT=/mnt/k/x86 /root/build-arch.sh x86
      - name: Guest test, unpatched
        run: sudo /root/vm.sh x86 x-a prep && sudo /root/vm.sh x86 x-a run /root/out/x86/bzImage-base base
      - name: Guest test, fix
        run: sudo /root/vm.sh x86 x-a run /root/out/x86/bzImage-fix fix
      - name: Collect
        if: always()
        run: |
          # the glob must expand as root: /root is not readable by the runner user
          sudo sh -c 'cp -r /root/out results; cp /root/vm/x-a/console-*.log results/ || echo "no console logs"'
          sudo chown -R "$USER" results; rm -f results/x86/bzImage-*
      - name: Summary
        if: always()
        env:
          NAME: ${{ matrix.name }}
          SHA: ${{ matrix.sha }}
        run: |
          mkdir -p results
          { echo "Kernel \`$NAME\` at \`$SHA\`"; echo; python3 summarize.py "$NAME" results base fix; } | tee -a "$GITHUB_STEP_SUMMARY" results/summary.md
          # summarize.py exits non-zero on a failed check; tee's status would hide it
          python3 summarize.py "$NAME" results base fix > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: aa3833-x86-${{ matrix.name }}
          path: results
